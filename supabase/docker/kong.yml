_format_version: "1.1"

services:

- name: auth-v1-open
  url: http://supabase-auth:9999/verify
  routes:
  - name: auth-v1-open
    strip_path: true
    paths: [ /auth/v1/verify ]
  plugins:
  - name: cors

- name: auth-v1-open-callback
  url: http://supabase-auth:9999/callback
  routes:
  - name: auth-v1-open-callback
    strip_path: true
    paths: [ /auth/v1/callback ]
  plugins:
  - name: cors

- name: auth-v1-open-authorize
  url: http://supabase-auth:9999/authorize
  routes:
  - name: auth-v1-open-authorize
    strip_path: true
    paths: [ /auth/v1/authorize ]
  plugins:
  - name: cors

- name: auth-v1
  url: http://supabase-auth:9999/
  routes:
  - name: auth-v1-all
    strip_path: true
    paths: [ /auth/v1/ ]
  plugins:
  - name: cors
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"
      replace:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"

- name: rest-v1
  url: http://supabase-rest:3000/
  routes:
  - name: rest-v1-all
    strip_path: true
    paths: [ /rest/v1/ ]
  plugins:
  - name: cors
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"
      replace:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"

- name: storage-v1-s3
  url: http://supabase-storage:5000/s3
  routes:
  - name: storage-v1-s3-all
    strip_path: true
    paths: [ /storage/v1/s3/ ]
  plugins:
  - name: cors

- name: storage-v1
  url: http://supabase-storage:5000/
  routes:
  - name: storage-v1-all
    strip_path: true
    paths: [ /storage/v1/ ]
  plugins:
  - name: cors
  - name: request-transformer
    config:
      add:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"
      replace:
        headers:
        - "Authorization: $((headers.authorization) or headers.apikey)"

- name: pg-meta
  url: http://supabase-meta:8080/
  routes:
  - name: pg-meta-all
    strip_path: true
    paths: [ /pg/ ]
  plugins:
  - name: cors
