kind: ConfigMap
apiVersion: v1
metadata:
  name: kitaably-ollama-config
  namespace: kitaably
data:
  OLLAMA_KEEP_ALIVE: "30m"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_CONTEXT_LENGTH: "4096"
  # Threads llama.cpp may use. Ollama's default counts PHYSICAL cores, and a
  # t3.xlarge is 4 vCPUs on 2 physical -- so it picked n_threads = 2 and left half
  # the node idle at 1866m CPU while a paper generated. Measured on this cluster,
  # llama3.2:3b, same prompt: 5.24 -> 7.68 tok/s generation (+47%) and 17.3 ->
  # 25.1 tok/s prompt eval (+45%) going from 2 threads to 4.
  #
  # There is no env var for this -- OLLAMA_NUM_THREADS does not exist, and setting
  # it is silently ignored (it is absent from Ollama's own "server config" dump).
  # The only lever is the model's `num_thread` parameter, which is why the startup
  # script below bakes a Modelfile instead of exporting a variable.
  #
  # Match this to the node's vCPU count. Above that, threads contend and it gets
  # SLOWER; the pod is alone on this node, so all 4 are ours to take.
  OLLAMA_NUM_THREADS_EFFECTIVE: "4"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kitaably-ollama
  namespace: kitaably
spec:
  selector:
    matchLabels:
      app: kitaably-ollama-label
  serviceName: "ollama-service"
  replicas: 1
  template:
    metadata:
      labels:
        app: kitaably-ollama-label
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: standard-workers-xlarge
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "llm-inference"
        effect: "NoSchedule"

      containers:
      - name: kitaably-ollama-container
        image: ollama/ollama:latest
        command: [ "/bin/sh", "-c" ]
        args:
        - |
          set -e
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

          # Re-tag the pulled model with the thread count this node can actually
          # feed. `num_thread` is a MODEL parameter -- there is no environment
          # variable for it -- so the only way to raise it is to derive a model
          # that carries it. Cheap: a Modelfile FROM an existing model adds a
          # metadata layer, it does not re-download the 2 GB of weights.
          #
          # num_ctx is restated here because a derived model does NOT inherit
          # OLLAMA_CONTEXT_LENGTH; leaving it off silently drops the context back
          # to the Ollama default and truncates generation prompts.
          printf 'FROM llama3.2:3b\nPARAMETER num_thread %s\nPARAMETER num_ctx %s\n' \
            "$OLLAMA_NUM_THREADS_EFFECTIVE" "$OLLAMA_CONTEXT_LENGTH" > /tmp/Modelfile
          ollama create llama3.2:3b-tuned -f /tmp/Modelfile

          wait
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        envFrom:
        - configMapRef:
            name: kitaably-ollama-config
        resources:
          requests:
            cpu: "3500m"
            memory: "6Gi"
          limits:
            memory: "10Gi"
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 120
          periodSeconds: 10
        ports:
        - containerPort: 11434

  volumeClaimTemplates:
  - metadata:
      name: ollama-models
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 5Gi
---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: kitaably
spec:
  selector:
    app: kitaably-ollama-label
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
