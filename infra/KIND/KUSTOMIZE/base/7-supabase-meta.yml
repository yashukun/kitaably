apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-meta
  namespace: kitaably
spec:
  selector:
    matchLabels:
      app: supabase-meta-label
  replicas: 1
  template:
    metadata:
      labels:
        app: supabase-meta-label
    spec:
      containers:
      - name: supabase-meta
        image: public.ecr.aws/supabase/postgres-meta:v0.98.0
        env:
        - name: PG_META_PORT
          value: "8080"
        - name: PG_META_DB_HOST
          value: "supabase-db-service"
        - name: PG_META_DB_PORT
          value: "5432"
        - name: PG_META_DB_USER
          valueFrom:
            secretKeyRef:
              name: kitaably-secrets
              key: POSTGRES_USER
        - name: PG_META_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kitaably-secrets
              key: POSTGRES_PASSWORD

        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-meta-service
  namespace: kitaably
spec:
  selector:
    app: supabase-meta-label
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
