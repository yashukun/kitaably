kind: ConfigMap
apiVersion: v1
metadata:
  name: kitaably-ollama-config
  namespace: kitaably
data:
  OLLAMA_KEEP_ALIVE: "30m"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_CONTEXT_LENGTH: "4096"
  # Threads llama.cpp may use. Ollama's default counts PHYSICAL cores, so on a
  # 4-vCPU / 2-physical box it picks n_threads = 2 and leaves half the machine
  # idle. Measured on EKS (t3.xlarge, llama3.2:3b, same prompt): 5.24 -> 7.68
  # tok/s generation and 17.3 -> 25.1 tok/s prompt eval, going 2 -> 4 threads.
  #
  # There is no env var for this -- OLLAMA_NUM_THREADS does not exist and is
  # silently ignored. The only lever is the model's `num_thread` parameter, which
  # is why the startup script bakes a Modelfile. Match the node's vCPU count;
  # above it, threads contend and it gets slower.
  OLLAMA_NUM_THREADS_EFFECTIVE: "4"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kitaably-ollama
  namespace: kitaably
spec:
  selector:
    matchLabels:
      app: kitaably-ollama-label
  serviceName: "ollama-service"
  replicas: 1
  template:
    metadata:
      labels:
        app: kitaably-ollama-label
    spec:

      containers:
      - name: kitaably-ollama-container
        image: ollama/ollama:latest
        command: [ "/bin/sh", "-c" ]
        args:
        - |
          set -e
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

          # Re-tag with the thread count this node can feed. `num_thread` is a
          # MODEL parameter -- no environment variable sets it -- so raising it
          # means deriving a model that carries it. Cheap: a Modelfile FROM an
          # existing model adds a metadata layer, it does not re-download weights.
          #
          # num_ctx is restated because a derived model does NOT inherit
          # OLLAMA_CONTEXT_LENGTH; omitting it silently truncates long prompts.
          printf 'FROM llama3.2:3b\nPARAMETER num_thread %s\nPARAMETER num_ctx %s\n' \
            "$OLLAMA_NUM_THREADS_EFFECTIVE" "$OLLAMA_CONTEXT_LENGTH" > /tmp/Modelfile
          ollama create llama3.2:3b-tuned -f /tmp/Modelfile

          wait
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        envFrom:
        - configMapRef:
            name: kitaably-ollama-config
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 120
          periodSeconds: 10
        ports:
        - containerPort: 11434

  volumeClaimTemplates:
  - metadata:
      name: ollama-models
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 5Gi
---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: kitaably
spec:
  selector:
    app: kitaably-ollama-label
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
