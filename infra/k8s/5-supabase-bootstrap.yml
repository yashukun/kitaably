apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-bootstrap
  namespace: kitaably
  labels:
    app: supabase-bootstrap
spec:
  template:
    metadata:
      name: supabase-bootstrap
      labels:
        app: supabase-bootstrap
    spec:
      containers:
      - name: supabase-bootstrap-container
        image: yashukun/kitaably-bootstrap:latest
        args: [ "migrate", "buckets" ]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kitaably-secrets
              key: DATABASE_URL
      restartPolicy: Never
