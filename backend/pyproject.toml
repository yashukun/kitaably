[project]
name = "kitaably-backend"
version = "0.1.0"
description = "Kitaably API and Celery workers"
requires-python = ">=3.12"

dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.32",       # multipart uploads (books, evidence); <0.0.31 has parser DoS holes

    # --- config ---
    "pydantic>=2.11",
    "pydantic-settings>=2.6",

    # --- database (async only; no sync driver anywhere) ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.5",                  # vector(384) column type for SQLAlchemy; 0.5 returns list, no numpy

    # --- auth: verify Supabase JWTs against the project JWKS ---
    "pyjwt[crypto]>=2.13",            # 2.13 fixes PyJWK alg-confirmation + JWKS cache-wipe; both on our path

    # --- background work ---
    "celery[redis]>=5.4",
    "redis>=5.2",

    # --- outbound clients ---
    "httpx>=0.27",                    # embeddings service + Supabase Storage REST
    "openai>=1.54",                   # OpenAI-compatible: Ollama in dev, OpenAI in deploy

    # --- observability ---
    "prometheus-client>=0.21",

    # --- document parsing (Phase 3; declared now so the image is built for it) ---
    "pymupdf>=1.24",                  # pdf
    "python-docx>=1.1",               # docx
    "python-pptx>=1.0",               # pptx
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: `Depends(...)` in an argument default IS the FastAPI convention, and it
# is how every guard in app/core/deps.py is declared. Flagging it would train us
# to ignore the whole rule.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
